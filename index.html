<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1131" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Glimmerstones" />
    <title>Glimmerstones</title>
  </head>
  <body>
    <div id="app">
      <section id="start" class="screen">
        <canvas id="start-gems" aria-hidden="true"></canvas>
        <div class="start-inner">
          <div class="logo">Glimmerstones</div>
          <div class="tagline" id="tagline"></div>
          <h1 id="greeting"></h1>
          <p id="phrase"></p>
          <button id="play" class="big primary"><span id="play-label"></span><small id="play-sub"></small></button>
          <button id="open-gallery" class="big"><span id="gallery-label"></span><small id="gallery-sub"></small></button>
        </div>
      </section>

      <section id="game" class="screen" hidden>
        <header class="bar">
          <button class="round" id="home"></button>
          <div class="title">
            <div class="name">Glimmerstones</div>
            <div class="level" id="level"></div>
          </div>
          <button class="round" id="sound-game"></button>
        </header>
        <main id="field"><canvas id="board"></canvas></main>
        <footer id="bottom">
          <button id="undo"><span class="ico"></span><span class="lbl"></span></button>
          <button id="restart"><span class="ico"></span><span class="lbl"></span></button>
          <button id="shelf"><span class="ico"></span><span class="lbl"></span></button>
          <button id="hint"><span class="ico"></span><span class="lbl"></span></button>
        </footer>
      </section>

      <section id="gallery" class="screen" hidden>
        <header class="bar">
          <button class="round" id="gallery-back"></button>
          <div class="title">
            <div class="level" id="gallery-title"></div>
            <div class="name" id="gallery-count"></div>
          </div>
          <span class="round spacer"></span>
        </header>
        <div id="gallery-grid"></div>
      </section>

      <div id="overlay" hidden><div class="card" id="card"></div></div>
      <div id="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
